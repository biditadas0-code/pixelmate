<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pixelmate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f1a;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-container {
    width: 420px;
    height: 640px;
    background: #17172b;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .chat-header {
    background: linear-gradient(135deg, #6d28d9, #4c1d95);
    color: white;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message table {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
  white-space: normal;
}
.message pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-x: auto;
  max-width: 100%;
}
.message th, .message td {
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 10px;
  text-align: left;
}

  .user {
    align-self: flex-end;
    background: #6d28d9;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .bot {
    align-self: flex-start;
    background: #2a2a45;
    color: #e5e5e5;
    border-bottom-left-radius: 4px;
  }

  .chat-input {
    display: flex;
    padding: 12px;
    background: #12121f;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #21213a;
    color: white;
    font-size: 14px;
    outline: none;
  }

  .chat-input button {
    background: #6d28d9;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  .chat-input button:hover {
    background: #5b21b6;
  }

  .typing {
    align-self: flex-start;
    color: #999;
    font-size: 13px;
    font-style: italic;
    padding: 4px 14px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script></head>
<body>

<div class="chat-container">
  <div class="chat-header">🤖pixelmate</div>
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">Yo 🖐🏻 got a problem or some code acting sus? I gotchu😉</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type a message or paste code..." />
    <select id="voiceLang">
      <option value="en-IN">English</option>
      <option value="hi-IN">हिंदी</option>
      <option value="bn-IN">বাংলা</option>
    </select>
    <button onclick="startVoice()">🎤</button>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById('chatMessages');
  const input = document.getElementById('userInput');
function startVoice(){
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  const lang = document.getElementById('voiceLang').value;
  recognition.lang = lang;
  recognition.onresult = function(event) {
    document.getElementById('userInput').value = event.results[0][0].transcript;
  };
  recognition.start();
}
function speak(text) {
      const cleanText = text
        .replace(/^\|?[-:\s|]+\|?$/gm, '')
        .replace(/\|/g, ' ')
        .replace(/#{1,6}\s?/g, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/`{1,3}(.*?)`{1,3}/g, '$1')
        .replace(/\[(.*?)\]\(.*?\)/g, '$1')
        .replace(/^[-*+]\s/gm, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      const lang = document.getElementById('voiceLang').value;
      utterance.lang = lang;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  function addMessage(text, sender) {
    const msg = document.createElement('div');
    msg.className = 'message ' + sender;
    if (sender === 'bot') {
      msg.innerHTML = marked.parse(text, { gfm: true, breaks: true });
      
    const copyBtn = document.createElement('button');
      copyBtn.textContent = '📋';
      copyBtn.className = 'copy-btn';
      copyBtn.onclick = function() {
        navigator.clipboard.writeText(text);
        copyBtn.textContent = '✅';
        setTimeout(() => { copyBtn.textContent = '📋'; }, 1000);
      };
      msg.appendChild(copyBtn);
      const speakBtn = document.createElement('button');
      speakBtn.textContent = '🔊';
      speakBtn.className = 'speak-btn';
      speakBtn.onclick = function() {
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();
        } else {
          speak(text);
        }
      };
      msg.appendChild(speakBtn);

      const shareBtn = document.createElement('button');
      shareBtn.textContent = '📤';
      shareBtn.className = 'share-btn';
      shareBtn.onclick = function() {
        if (navigator.share) {
          navigator.share({ text: text }).catch(() => {});
        } else {
          navigator.clipboard.writeText(text);
          shareBtn.textContent = '✅';
          setTimeout(() => { shareBtn.textContent = '📤'; }, 1000);
        }
      };
      msg.appendChild(shareBtn);
    } else {
      msg.textContent = text;
    }
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';

    const typingIndicator = document.createElement('div');
    typingIndicator.className = 'typing';
    typingIndicator.textContent = 'Assistant is typing...';
    messagesDiv.appendChild(typingIndicator);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();

      typingIndicator.remove();
      addMessage(data.reply, 'bot');
    } catch (err) {
      typingIndicator.remove();
      addMessage('Something went wrong connecting to the server.', 'bot');
    }
  }
</script>

</body>
</html>
